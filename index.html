<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>The Diet Planner</title>
</head>
<body>
    <h1>The Diet Planner</h1>
    <p>
        "The Diet Planner" es un programa diseñado para maximizar tus requerimientos nutricionales diarios 
        al menor costo posible. <strong>¡Salvando tu Cartera y tu Estomago!</strong>
    </p>

    <h2>Selector de Problemas</h2>

    <select id="diet-select" name="diet">
        <option value="">---Selecciona una dieta---</option>
        <option value="Rice-and-Beans">Arroz y Frijoles</option>            
        <option value="Eggs-and-Toasts">Huevos y Pan Tostado</option>
        <option value="Chicken-and-Salad">Pollo y Ensalada</option>
    </select>

    <h3>Resumen del Problema</h3>
    <div id="problem-summary"></div> <!--Problem summary container-->

    <!--Graph Container-->
    <div id="graph-container"></div> 
    
    <h2>Resultados</h2> <!--This is header separator for the results panel-->
    <div div="results"></div>
    
    <!--Navigation Buttons-->
    <div id="nav-controls">
        <button type="button">Anterior</button>
        <button type="button">Siguiente</button>
    </div>
</body>
</html>
